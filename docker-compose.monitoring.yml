services:
  # -------------------------------------------------------------------------
  # 1. Prometheus Time-Series Metrics Collector & Alerting Engine
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: snmk-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - snmk-monitoring
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  # -------------------------------------------------------------------------
  # 2. Grafana Visualization, Dashboards & Alerting Platform
  # -------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: snmk-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-ChangeMeSecureSNMK2026!}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=info
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - snmk-monitoring
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # -------------------------------------------------------------------------
  # 3. Grafana Loki Centralized Log Aggregator
  # -------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.1.1
    container_name: snmk-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./deploy/monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - snmk-monitoring
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # -------------------------------------------------------------------------
  # 4. Grafana Tempo Distributed Tracing Engine
  # -------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:2.6.0
    container_name: snmk-tempo
    restart: unless-stopped
    ports:
      - "3200:3200"
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    command: -config.file=/etc/tempo.yaml
    volumes:
      - ./deploy/monitoring/tempo/tempo-config.yml:/etc/tempo.yaml:ro
      - tempo_data:/tmp/tempo
    networks:
      - snmk-monitoring
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # -------------------------------------------------------------------------
  # 5. Node Exporter (Host System Telemetry)
  # -------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: snmk-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - snmk-monitoring
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  # -------------------------------------------------------------------------
  # 6. cAdvisor (Container Resource Telemetry)
  # -------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: snmk-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - snmk-monitoring
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:

networks:
  snmk-monitoring:
    name: snmk-monitoring-net
    driver: bridge
