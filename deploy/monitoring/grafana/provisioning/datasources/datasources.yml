apiVersion: 1

datasources:
  # 1. Prometheus Metrics Datasource (Primary Default)
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 10s
      httpMethod: POST
    editable: false

  # 2. Grafana Loki Centralized Logs Datasource
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 2000
    editable: false

  # 3. Grafana Tempo Distributed Tracing Datasource
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      httpMethod: GET
      tracesToLogs:
        datasourceUid: 'Loki'
        tags: ['request_id', 'agent_id']
    editable: false
