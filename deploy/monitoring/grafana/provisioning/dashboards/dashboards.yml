apiVersion: 1

providers:
  - name: 'SNMK Enterprise Dashboards'
    orgId: 1
    folder: 'SNMK Observability'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: true
