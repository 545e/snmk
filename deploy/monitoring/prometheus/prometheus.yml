# Prometheus Configuration for SNMK Cybersecurity Platform
global:
  scrape_interval: 10s
  evaluation_interval: 10s
  scrape_timeout: 8s
  external_labels:
    monitor: 'snmk-observability-hub'
    environment: 'production'

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  # 1. Primary SNMK Application & Security Platform
  - job_name: 'snmk-platform'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['swa-ai:8000', 'host.docker.internal:8000', '127.0.0.1:8000']
        labels:
          app: 'snmk-cybersecurity-platform'
          role: 'security-core'

  # 2. Host System Metrics (Node Exporter)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          role: 'host-infrastructure'

  # 3. Docker Container Metrics (cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          role: 'container-runtime'

  # 4. Prometheus Self-Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          role: 'monitoring-engine'
