# =====================================================================
# SonarQube / SonarCloud Project Configuration
# Platform: SNMK - Autonomous Cybersecurity Platform (v2.3.0-Sentinel)
# =====================================================================

# Project Identification
sonar.projectKey=snmk-cybersecurity-platform
sonar.projectName=SNMK - Autonomous Cybersecurity Platform
sonar.projectVersion=2.3.0-Sentinel

# Source and Test Scope
sonar.sources=web,core,agents,plugins,config
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Language Runtimes
sonar.python.version=3.10, 3.11, 3.12
sonar.javascript.environments=browser,node

# Test Coverage Integration
sonar.python.coverage.reportPaths=coverage.xml

# Directory & Artifact Exclusions
sonar.exclusions=**/__pycache__/**,venv/**,.pytest_cache/**,backups/**,reports/**,data/**,*.egg-info/**,web/static/styles.css,*.db
sonar.test.inclusions=tests/**/test_*.py

# Duplication Analysis Scope
sonar.cpd.exclusions=tests/**,web/static/styles.css,config/**

# External Static Analysis & SAST Import (Generic Issue Format)
sonar.externalIssuesReportPaths=reports/sonar-generic-issues.json

# Quality Gate Settings
sonar.qualitygate.wait=false
