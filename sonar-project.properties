# SonarQube project configuration for SNMK (Autonomous Cybersecurity Platform)
#
# Used by:
#   - local:  sonar-scanner -Dsonar.token=...  (from the repository root)
#   - CI:     .github/workflows/sonarqube.yml
#
# Requires SonarQube 9.9+ / SonarQube Community Build 24.x or newer, and
# sonar-scanner-cli 6.x / 7.x.

sonar.projectKey=snmk
sonar.projectName=SNMK Autonomous Cybersecurity Platform
sonar.projectVersion=2.3.0

# --- Source layout -------------------------------------------------------
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

# Generated artefacts, vendored blobs and runtime state are not source.
sonar.exclusions=\
  .venv/**,\
  venv/**,\
  .git/**,\
  __pycache__/**,\
  *.pyc,\
  data/**,\
  tools/bin/**,\
  backups/**,\
  reports/kc_rep_*,\
  .pytest_cache/**,\
  .coverage,\
  htmlcov/**,\
  **/node_modules/**,\
  web/static/vendor/**

# --- Coverage ------------------------------------------------------------
# pytest-cov produces the report; the path is relative to the project root.
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.coverage.reportPaths=htmlcov/lcov.info
sonar.coverage.exclusions=tests/**,web/static/**,**/node_modules/**
sonar.python.coverage.exclusions=tests/**

# --- External issue trackers (optional) ----------------------------------
# Set these to route findings to GitHub issues instead of only the dashboard.
# sonar.issue.github.id=545e
# sonar.issue.github.repository=snmk
# sonar.issue.github.token=${env.GITHUB_TOKEN}

# --- Quality gate --------------------------------------------------------
# The gate is deliberately conservative: it blocks new debt rather than
# demanding a clean sheet, because the existing backlog is large and
# pre-dates this configuration.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
