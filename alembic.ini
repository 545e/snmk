# Alembic configuration for the optional MySQL backend.
#
# This is SCAFFOLDING ONLY. No migration is executed automatically and the
# working SQLite database is never touched. A migration is run only when an
# operator explicitly sets SWA_DB_BACKEND=mysql, supplies the MYSQL_* secrets
# and runs `alembic upgrade head` after reviewing the generated SQL.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is supplied at runtime from MYSQL_* environment variables.
# See migrations/env.py -- no credential is ever stored in this file.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
