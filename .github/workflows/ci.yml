name: SWA AI Cross-Platform CI & Verification Pipeline

on:
  push:
    branches: [ main, generation-2-complete-modernization ]
  pull_request:
    branches: [ main, generation-2-complete-modernization ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12']
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libpcap-dev

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.git,SWA
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics --exclude=venv,.git,SWA

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: .
          CI: "true"
        run: |
          set -o pipefail
          pytest tests/ -v --ignore=tests/e2e_map_browser_test.py 2>&1 | tee pytest-report.txt

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pytest-report.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Test Cyber Tools & Autonomous Engines Import
        env:
          PYTHONPATH: .
          CI: "true"
        run: |
          python -c "
          import core.cyber_tools
          import agents.amass_engine
          import web.server
          import core.agent_registry
          import core.network
          print('All core modules successfully imported!')
          "

      - name: Test CLI Commands Execution
        env:
          PYTHONPATH: .
        run: |
          python swa_cli.py --help
          python swa_cli.py --hash "ci_verification_test"
          python swa_cli.py --cidr "192.168.1.0/24"
