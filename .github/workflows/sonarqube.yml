name: "SonarQube Static Analysis"

on:
  push:
    branches: [ main, generation-2-complete-modernization ]
  pull_request:
    branches: [ main, generation-2-complete-modernization ]
  schedule:
    - cron: '45 2 * * 1'

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      pull-requests: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for accurate blame and new-code detection

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install libpcap (scapy dependency)
        run: sudo apt-get update -y && sudo apt-get install -y libpcap-dev

      - name: Run tests with coverage
        env:
          PYTHONPATH: .
          CI: "true"
        run: |
          pytest tests/ \
            --ignore=tests/e2e_map_browser_test.py \
            --cov=core --cov=agents --cov=plugins --cov=reports --cov=web \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      # The scan runs even when the tests fail, so a red test run still
      # produces a SonarQube report. The job fails on the quality gate
      # result rather than on the scanner's exit code, which is why this
      # step is allowed to continue on error.
      - name: SonarQube Scan
        id: sonar
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::notice::SONAR_TOKEN is not configured; skipping the SonarQube scan."
            exit 0
          fi
          curl -fsSL https://raw.githubusercontent.com/sonarsource/sonar-scanner-cli/master/bin/sonar-scanner -o sonar-scanner
          chmod +x sonar-scanner
          ./sonar-scanner \
            -Dsonar.projectKey=snmk \
            -Dsonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.sources=. \
            -Dsonar.tests=tests \
            -Dsonar.python.coverage.reportPaths=coverage.xml \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=600

      - name: Enforce the SonarQube Quality Gate
        if: steps.sonar.outcome == 'failure'
        run: |
          echo "::error::The SonarQube quality gate failed. See the SonarQube dashboard for the details."
          exit 1
